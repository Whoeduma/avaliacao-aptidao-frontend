<header class="cabecalho-site">
  <div class="cabecalho-conteudo">

    <div class="identidade-evento">
      <div class="icone-corrida">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
          />
          <path d="M3.5 12h4l2-3 3 6 2-3h6" />
        </svg>
      </div>

      <div class="nome-evento">
        <strong>5ª Corrida Solidária</strong>
        <span>· Vila Esperança</span>
      </div>
    </div>

    <div class="contador-inscritos" aria-live="polite">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>

      <span>Inscritos: <strong>{{ totalInscritos() }}</strong></span>
    </div>

  </div>
</header>

<main class="conteudo-principal">
  @if (avisoArmazenamento(); as aviso) {
    <p role="alert" class="aviso-armazenamento">{{ aviso }}</p>
  }
  <router-outlet></router-outlet>
</main>



@if (mensagemSucesso(); as mensagem) {
  <div class="fundo-notificacao">
    <section
      class="modal-sucesso"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titulo-sucesso"
      aria-describedby="descricao-sucesso"
    >
      <div class="icone-modal-sucesso">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="m8 12 2.5 2.5L16 9" />
        </svg>
      </div>

      <h2 id="titulo-sucesso">
        {{ mensagem }}
      </h2>

      <p id="descricao-sucesso">
        @if (mensagem.includes('atualizada')) {
          As alterações foram salvas.
        } @else {
          O participante foi cadastrado.
        }
      </p>

      <button
        type="button"
        class="botao-continuar-sucesso"
        (click)="fecharNotificacao()"
      >
        Continuar
      </button>
    </section>
  </div>
}
